<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1118" />
    <title>Prisma · Barra superior Synapse</title>
    <!-- Fondo desde el primer pintado, antes de que cargue el CSS de React. -->
    <style>
      html, body, #root { margin: 0; background: #e9e2e9; }
      html.dark, html.dark body, html.dark #root { background: #302a36; }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("prisma_theme") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = t === "dark" || (t === "system" && prefersDark);
          document.documentElement.setAttribute("data-theme", t);
          if (isDark) document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/zone.tsx"></script>
  </body>
</html>
