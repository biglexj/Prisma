<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prisma · Audio al teléfono</title>
<style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:system-ui,sans-serif}
body{display:flex;justify-content:center;padding:12px;box-sizing:border-box}
#message{padding:8px 22px;border-radius:9999px;background:rgba(20,20,26,.92);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:13.44px;font-weight:750;box-shadow:0 8px 16px rgba(0,0,0,.3);text-align:center;max-width:100%;overflow-wrap:anywhere}
</style></head>
<body><div id="message" role="status"></div><script type="module">
const render=()=>{document.getElementById('message').textContent=window.__audioToast ?? ''};
window.addEventListener('audio-toast',render);render();
</script></body></html>
