[package]
name = "prisma"
version = "0.6.0"
description = "Visor y reproductor multimedia local-first"
authors = ["Biglex J"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "prisma_lib"
crate-type = ["rlib"]

[features]
default = ["mpv"]
mpv = ["dep:libmpv2"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libmpv2 = { version = "6", optional = true }
lofty = "=0.24.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"

